# Sector classification per underlying equity symbol (GICS-style, approximate) - single source
# of truth for both directly-held stocks and ETF look-through constituents, so a sector is never
# defined twice. Symbols not listed here (e.g. an ETF like NOBL with no `etf_holdings_<symbol>.yaml` entry
# of its own yet) fall back to "Unclassified" in the sector exposure chart rather than guessing.
# The stock market is divided into 11 official sectors according to the Global Industry
# Classification Standard (GICS).
# - Communication Services: Telecom, media, entertainment, and interactive online services.
# - Consumer Discretionary: Non-essential goods and services like apparel, autos, luxury items, and hotels.
# - Consumer Staples: Everyday essentials like food, beverages, and household products.
# - Energy: Oil, gas, consumable fuels, and renewable energy production.
# - Financials: Banks, insurance, asset management, and financial exchange firms.
# - Health Care: Pharmaceuticals, biotechnology, medical devices, and healthcare providers.
# - Industrials: Aerospace, defense, machinery, manufacturing, and logistics.
# - Information Technology: Software, hardware, semiconductors, and IT services.
# - Materials: Chemicals, metal mining, forestry, and packaging products.
# - Real Estate: Real estate investment trusts (REITs) and property management.
# - Utilities: Electric, gas, and water service providers.
